# ==========================================================
# 🐳 Docker Compose - Delivery Tech API + Observabilidade Total
# ==========================================================
# Sobe a API Java, Prometheus, Grafana, Zipkin e Nginx
#
# Como rodar tudo junto:
#   docker compose up -d --build
#
# Como parar tudo:
#   docker compose down
# ==========================================================

services:

  # 1. 🍕 SUA API SPRING BOOT
  delivery-api:
    build: .
    container_name: delivery-api
    restart: unless-stopped
    ports:
      # PORTA_SEU_PC : PORTA_DENTRO_CONTAINER
      - "8080:8080"
    environment:
      - SERVER_PORT={SERVER_PORT}
      - JWT_SECRET={JWT_SECRET}
      - ZIPKIN_ENDPOINT={ZIPKIN_ENDPOINT}
    depends_on:
      - zipkin
    networks:
      - delivery-network

  # 2. 📊 PROMETHEUS (Coletor e Banco de Métricas)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Monta o arquivo de configuração local para dentro do container
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - delivery-api
    networks:
      - delivery-network

  # 3. 📈 GRAFANA (Painéis Visuais e Gráficos)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - delivery-network

  # 4. ⏱️ ZIPKIN (Distributed Tracing / Rastreamento de Rotas)
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - delivery-network
  # 5. 🌐 NGINX
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"      # Porta 80 do seu PC -> Porta 80 do Nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - delivery-api
    networks:
      - delivery-network

  # 6. ⚡ REDIS (Cache em Memória)
  redis:
    image: redis:7-alpine
    container_name: delivery-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - delivery-network

# Rede compartilhada para os containers se comunicarem pelo nome do serviço
networks:
  delivery-network:
    driver: bridge

# Volume persistente para salvar os dados do Grafana
volumes:
  grafana-data:
