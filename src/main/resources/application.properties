# Configuração do servidor
server.port=8080

# Configuração do H2 Database
spring.datasource.url=jdbc:h2:mem:deliverydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações de desenvolvimento
spring.devtools.restart.enabled=true

# Configurações específicas para JDK 21
spring.jpa.open-in-view=false
logging.level.org.springframework.web=DEBUG

# Configurações do JWT
# Configurações do JWT com fallback para desenvolvimento
jwt.secret=${JWT_SECRET:minhaSecretSuperSecretaParaTestesLocaisComTamanhoSuficiente123}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Monitoramento e Actuator (Prometheus, Métricas e Health)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Tracing Distribuído com Zipkin
# Amostra 100% das requisições em ambiente de desenvolvimento
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# Ativar Redis como provedor do Spring Cache
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Tempo de expiração padrão do cache (TTL: ex. 10 minutos)
spring.cache.redis.time-to-live=10m
# Evita salvar valores nulos no cache
spring.cache.redis.cache-null-values=false